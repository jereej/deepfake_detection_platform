[project]
name = "deftor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
]

[project.scripts]
deftor = "deftor.cli:run_cli"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120