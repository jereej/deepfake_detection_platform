[project]
name = "deftor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "av>=18.1.0",
    "beaupy>=3.12.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.26.0",
    "ollama>=0.6.2",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.22",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
    "torch>=2.13.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.28.0",
    "transformers[sentencepiece]>=5.14.1",
]

[project.scripts]
deftor = "deftor.cli:run_cli"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
